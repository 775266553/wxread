name: Regression checks

on:
  push:
    branches: [main, master]
    paths: ['**.py', 'tests/**', 'pages/**', 'requirements*.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['**.py', 'tests/**', 'pages/**', 'requirements*.txt', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python regression checks
        run: python -m unittest discover -s tests
      - name: Run browser client regression checks
        run: |
          node tests/test_github_client.cjs
          node tests/test_github_session.cjs
          node tests/test_pages_polling.cjs
