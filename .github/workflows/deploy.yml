name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: false

on:
  schedule:
    # 凌晨任务：北京时间每天 01:07（UTC 前一天 17:07），避开 GitHub Actions 整点高峰
    - cron: '7 17 * * *'
    # 早间任务：北京时间每天 05:00（UTC 前一天 21:00）
    #- cron: '0 21 * * *'
    # 午间任务：北京时间每天 11:40（UTC 03:40）
    #- cron: '40 3 * * *'
    # 晚间任务：北京时间每天 22:00（UTC 14:00）
    #- cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      account_id:
        description: Empty runs all enabled accounts
        required: false
        type: string

permissions:
  contents: write

run-name: 'wxread-reading ${{ inputs.account_id || ''all'' }}'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead
    timeout-minutes: 360

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-actions.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-actions.txt

    - name: Run deployment script
      env:
        GH_TOKEN: ${{ github.token }}
        WXREAD_CONTROL_KEY: ${{ secrets.WXREAD_CONTROL_KEY }}
        READ_ACCOUNT_ID: ${{ inputs.account_id }}
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        WXREAD_ACCOUNTS_JSON: ${{ secrets.WXREAD_ACCOUNTS_JSON }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
        WEBHOOK_TYPE: ${{ vars.WEBHOOK_TYPE }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ vars.SMTP_PORT }}
        SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_FROM: ${{ secrets.SMTP_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}

      run: |
        python github_worker.py read

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
