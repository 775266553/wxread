<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>阅伴 · 微信读书控制台</title><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'self'">
  <meta name="description" content="微信读书多账户管理">
  <link rel="icon" href="./static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./static/style.css?v=e3573c5800"><script defer src="./static/libsodium.js?v=0a66b0fdfb"></script><script defer src="./static/libsodium-wrappers.js?v=828884732c"></script><script defer src="./static/github.js?v=95f7320fa6"></script><script defer src="./static/notifications.js?v=df425afe13"></script><script defer src="./static/app.js?v=532c3c7770"></script>
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v15"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8m1 3a6 6 0 0 1 4 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 6 9 7 9-7"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><path d="M9 3H3v6h6ZM21 3h-6v6h6ZM9 15H3v6h6ZM15 15h3v3h3v3h-6Zm6-3v3M12 3v3M3 12h3m6 0v6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-1L20 7a3 3 0 0 0-4-4L4 15Z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 4v6c0 4-4 7-8 9-4-2-8-5-8-9V7Zm-4 9 3 3 5-5"/></symbol>
</defs></svg>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="./"><span class="brand-symbol"><svg class="icon"><use href="#i-book"/></svg></span><span>阅伴</span></a>
    <div class="nav-label">控制台</div>
    <nav aria-label="主导航">
      <button class="nav-item active" data-view="overview"><svg class="icon"><use href="#i-grid"/></svg>总览<span class="nav-dot"></span></button>
      <button class="nav-item" data-view="accounts"><svg class="icon"><use href="#i-users"/></svg>账户管理<span id="nav-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="history"><svg class="icon"><use href="#i-list"/></svg>运行记录</button>
      <button class="nav-item" data-view="settings"><svg class="icon"><use href="#i-settings"/></svg>计划与通知</button>
    </nav>
    <div class="sidebar-footer"><span class="footer-avatar">阅</span><div>微信读书控制台</div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div><span class="topbar-label">控制台</span><span class="slash">/</span><span id="breadcrumb">总览</span></div><div class="topbar-right"><span class="live-status"><span class="status-dot"></span><span id="connection">正在连接</span></span><span id="today-label"></span><button id="logout" class="text-button" hidden>断开连接</button></div></header>
    <main id="content" aria-live="polite"><div class="loading">加载中…</div></main>
    <footer class="page-footer"><span>阅伴</span><a href="https://github.com/wbshm/wxread" target="_blank" rel="noreferrer">GitHub ↗</a></footer>
  </div>
</div>
<dialog id="bind-dialog" class="modal">
  <button class="icon-button modal-close" aria-label="关闭" data-close="bind-dialog"><svg class="icon"><use href="#i-close"/></svg></button>
  <div class="dialog-icon"><svg class="icon"><use href="#i-qr"/></svg></div><h2 id="bind-title">添加账户</h2><p class="muted">微信扫码后确认登录。</p>
  <div class="tabs"><button class="active" data-bind-tab="qr">扫码绑定</button><button data-bind-tab="import">导入 cURL</button></div>
  <form id="bind-form">
    <label>账户备注<input name="name" maxlength="80" placeholder="账户名称"></label>
    <div class="form-row"><label>目标时长（分钟）<input name="minutes" type="number" min="0.5" max="1440" step="0.5" value="20" required></label><label>通知邮箱（可选）<input name="email" type="email" placeholder="使用默认收件邮箱"></label></div>
    <div id="qr-panel"><div id="qr-area" class="qr-area"><svg class="icon"><use href="#i-qr"/></svg><span>点击生成二维码</span></div><p id="qr-status" class="qr-status"></p><button id="qr-start" class="button primary full" type="submit">生成二维码<svg class="icon"><use href="#i-arrow"/></svg></button></div>
    <div id="import-panel" hidden><label>微信读书 read 请求的 cURL<textarea name="curl" rows="5" placeholder="粘贴 read 请求的 cURL"></textarea></label><button class="button primary full" type="submit">导入并绑定</button></div>
    <p id="bind-error" class="form-error" role="alert"></p>
  </form>
</dialog>
<dialog id="edit-dialog" class="modal compact"><button class="icon-button modal-close" aria-label="关闭" data-close="edit-dialog"><svg class="icon"><use href="#i-close"/></svg></button><h2>账户设置</h2><form id="edit-form"><input name="id" type="hidden"><label>账户备注<input name="name" maxlength="80" required></label><label>目标时长（分钟）<input name="minutes" type="number" min="0.5" max="1440" step="0.5" required></label><label>通知邮箱<input name="email" type="email" placeholder="留空使用默认收件邮箱"></label><label class="toggle-label"><span>自动阅读</span><input name="enabled" type="checkbox" class="switch"></label><p id="edit-error" class="form-error"></p><button class="button primary full">保存设置</button></form><button id="delete-account" class="danger-link">移除账户</button></dialog>
<dialog id="auth-dialog" class="modal compact">
  <div class="dialog-icon"><svg class="icon"><use href="#i-shield"/></svg></div>
  <h2>连接仓库</h2>
  <p class="muted">仓库权限：Contents、Actions、Secrets 读写。</p>
  <form id="auth-form">
    <label>仓库<input name="repository" placeholder="owner/wxread" required autocomplete="off"></label>
    <label><span class="token-field-title">GitHub Token<a id="token-settings-link" class="token-settings-link" href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener noreferrer">配置 Token ↗</a></span><input name="token" type="password" aria-label="GitHub Token" autocomplete="off" placeholder="github_pat_…" required></label>
    <label class="toggle-label"><span>保持当前标签页连接</span><input name="remember" type="checkbox" class="switch"></label>
    <p class="section-description">在当前标签页保存登录信息，12 小时内刷新可恢复；断开后清除。</p>
    <p id="auth-error" class="form-error" role="status"></p><button class="button primary full">连接仓库</button>
  </form>
</dialog>
<dialog id="confirm-dialog" class="modal compact"><h2>移除账户</h2><p class="muted">移除账户，保留运行记录。</p><div class="confirm-actions"><button class="button" data-close="confirm-dialog">取消</button><button class="button danger" id="confirm-delete">移除账户</button></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
